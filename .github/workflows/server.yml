name: Run Live Server

on:
  workflow_dispatch: # Manual run button from GitHub Actions tab

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Start Node Server in Background
        run: npm start &

      - name: Expose Server using Tunnel
        run: |
          npx localtunnel --port 3000
