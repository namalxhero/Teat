<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Actions Live Server</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --text: #e6edf3; --accent: #238636; --border: #30363d; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 40px; border-radius: 12px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); max-width: 450px; width: 100%; }
        h1 { color: #58a6ff; margin-bottom: 10px; font-size: 24px; }
        p { color: #8b949e; font-size: 14.5px; line-height: 1.5; }
        .badge { background: rgba(35, 134, 54, 0.2); color: #3fb950; border: 1px solid rgba(35, 134, 54, 0.4); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; margin-bottom: 20px; }
        .btn { display: inline-block; margin-top: 20px; background: var(--accent); color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 600; transition: 0.2s; }
        .btn:hover { background: #2ea043; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">🟢 LIVE VIA GITHUB ACTIONS</div>
        <h1>Welcome to Stealth Server</h1>
        <p>This web application is currently hosted and running live directly inside a temporary GitHub Actions runner environment!</p>
        <a href="https://github.com" target="_blank" class="btn">Explore GitHub</a>
    </div>
</body>
</html>
